<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="pageBlockedTitle">Site blocked</title>
<style>
  :root {
    color-scheme: dark;
    --bg-1: #171a22; --bg-2: #0e0f14;
    --panel: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.09);
    --text: #eef0f4; --muted: #9aa0ac;
    --accent: #5b8cff; --accent-2: #8b7bff;
    --link: #7aa2ff; /* lighter blue for text, for 4.5:1 contrast */
    --button: #356ae6;
    --button-hover: #2f63db;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(circle at 20% 15%, rgba(91,140,255,0.16), transparent 45%),
      radial-gradient(circle at 80% 85%, rgba(139,123,255,0.14), transparent 45%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2));
    color: var(--text);
    text-align: center;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    padding: 40px 34px 32px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    backdrop-filter: blur(6px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    animation: rise 0.35s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: none; } }

  .lock-ring {
    width: 72px; height: 72px; margin: 0 auto 18px;
    border-radius: 50%;
    background: linear-gradient(140deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    box-shadow: 0 10px 30px rgba(91,140,255,0.35);
  }
  /* The padlock from the extension's icon: closed while the site is blocked
     (timer running or ended), open once it's off the list. */
  .lock-ring svg { width: 34px; height: 34px; }
  .lock-ring .lock-open, .lock-ring.open .lock-closed { display: none; }
  .lock-ring.open .lock-open { display: block; }
  /* Timer ended: still locked, but nothing is counting down any more. */
  .lock-ring.quiet { background: #3a4152; box-shadow: none; }
  h1 { font-size: 21px; margin: 0 0 6px; letter-spacing: 0.1px; }
  .dom {
    display: inline-block; margin: 2px 0 14px; padding: 4px 12px;
    background: rgba(255,255,255,0.06); border: 1px solid var(--border);
    border-radius: 100px; color: var(--link); font-weight: 600; font-size: 13px;
    word-break: break-all;
  }
  p.message { color: var(--muted); font-size: 13.5px; line-height: 1.6; margin: 0 0 20px; }

  .status {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 6px;
  }
  .status-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); margin-bottom: 8px; }
  .status-time { font-size: 20px; font-weight: 700; letter-spacing: 0.2px; font-variant-numeric: tabular-nums; }
  .status-time.ready { color: #34d399; }
  .status-time.ended { color: #c3c9d6; font-size: 17px; }
  .progress { height: 5px; background: rgba(255,255,255,0.08); border-radius: 100px; margin-top: 12px; overflow: hidden; }
  .progress .bar { height: 100%; border-radius: 100px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width 1s linear; }

  /* "Wrong site? Undo · 28 s" for 30 seconds after a new block */
  .undo { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .undo[hidden] { display: none; }
  .undo-btn {
    padding: 7px 14px; border-radius: 9px; border: 1px solid var(--border); cursor: pointer;
    background: rgba(255,255,255,0.06); color: var(--text);
    font: inherit; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .undo-btn:hover { background: rgba(255,255,255,0.12); }
  .undo-btn:disabled { opacity: 0.6; cursor: default; }
  .undo-btn:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .undo-btn[hidden] { display: none; }

  .hint { margin-top: 16px; font-size: 12px; color: var(--muted); line-height: 1.5; }
  .hint:empty { display: none; }

  .go {
    display: inline-block; margin-top: 18px; padding: 9px 16px; border-radius: 9px;
    background: var(--button); color: #fff; font-size: 13px; font-weight: 600; text-decoration: none;
    word-break: break-all;
  }
  .go:hover { background: var(--button-hover); }
  .go:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .go[hidden] { display: none; }

  /* Respect "reduce motion": no rising card or sliding bar. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="lock-ring" id="ring" aria-hidden="true">
      <svg class="lock-closed" viewBox="0 0 24 24"><path d="M7.5 10V7.5a4.5 4.5 0 0 1 9 0V10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path fill="currentColor" fill-rule="evenodd" d="M7.5 10h9A2.5 2.5 0 0 1 19 12.5v6a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 5 18.5v-6A2.5 2.5 0 0 1 7.5 10Zm4.5 3.2a1.6 1.6 0 0 0-.8 3V18a.8.8 0 0 0 1.6 0v-1.8a1.6 1.6 0 0 0-.8-3Z"/></svg>
      <svg class="lock-open" viewBox="0 0 24 24"><path d="M7.5 10V7.5a4.5 4.5 0 0 1 8.9-1" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path fill="currentColor" fill-rule="evenodd" d="M7.5 10h9A2.5 2.5 0 0 1 19 12.5v6a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 5 18.5v-6A2.5 2.5 0 0 1 7.5 10Zm4.5 3.2a1.6 1.6 0 0 0-.8 3V18a.8.8 0 0 0 1.6 0v-1.8a1.6 1.6 0 0 0-.8-3Z"/></svg>
    </div>
    <h1 id="title" data-i18n="blkTitle">This site is blocked</h1>
    <div class="dom" id="dom"></div>
    <p class="message" id="message" data-i18n="blkMessage">You blocked this for a reason. You can remove it once the timer below runs out.</p>

    <div class="status">
      <div class="status-label" id="statusLabel" data-i18n="blkRemovableIn">Removable in</div>
      <div class="status-time" id="statusTime" aria-live="off">—</div>
      <div class="progress" aria-hidden="true"><div class="bar" id="bar" style="width:0%"></div></div>
    </div>

    <div class="undo" id="undo" hidden>
      <span id="undoAsk" data-i18n="undoAsk">Wrong site?</span>
      <button class="undo-btn" id="undoBtn"></button>
    </div>

    <p class="hint" id="hint" data-i18n="blkHint">You can make the timer longer from the extension at any time. Removing the site becomes possible when the timer ends.</p>
    <a class="go" id="goLink" hidden></a>
  </main>
  <script type="module" src="blocked.js"></script>
</body>
</html>
