<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: light dark;
    --bg: #14161c;
    --panel: #1d212b;
    --panel-2: #262b37;
    --border: #333a48;
    --text: #eef0f4;
    --muted: #939bab;
    --accent: #5b8cff;
    --accent-2: #7aa2ff;
    --good: #34d399;
    --bad: #ff7a7a;
    --warn: #f5b545;
  }
  * { box-sizing: border-box; }
  body {
    width: 348px;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #171a22, #12141a);
    color: var(--text);
    padding: 16px;
  }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .logo {
    width: 30px; height: 30px; border-radius: 9px;
    background: linear-gradient(140deg, var(--accent), #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex: none;
  }
  h1 { font-size: 15px; margin: 0; letter-spacing: 0.1px; }
  .sub { font-size: 11.5px; color: var(--muted); margin: 1px 0 0; }

  .add-card {
    margin-top: 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px;
  }
  input[type="text"] {
    width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); font-size: 13px; outline: none;
    transition: border-color 0.15s ease;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  .add-row2 { display: flex; gap: 6px; margin-top: 8px; }
  select {
    flex: 1; padding: 8px 8px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); font-size: 12px; outline: none;
    min-width: 0;
  }
  select:focus { border-color: var(--accent); }
  button { font-family: inherit; }
  .btn-primary {
    padding: 8px 14px; border: none; border-radius: 8px; background: var(--accent);
    color: #fff; font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  .btn-primary:hover { background: var(--accent-2); }
  .btn-primary:active { transform: scale(0.97); }

  #msg {
    font-size: 11.5px; min-height: 0; margin: 0; padding: 0 2px;
    max-height: 0; overflow: hidden; opacity: 0;
    transition: max-height 0.2s ease, opacity 0.2s ease, margin 0.2s ease;
  }
  #msg.show { max-height: 30px; opacity: 1; margin: 9px 2px 0; }
  #msg.err { color: var(--bad); }
  #msg.ok { color: var(--good); }

  .list-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin: 16px 2px 8px;
  }
  .list-head h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); margin: 0; font-weight: 600; }
  #count { font-size: 11px; color: var(--muted); }

  ul { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow-y: auto; }
  ul::-webkit-scrollbar { width: 6px; }
  ul::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  li.item {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 11px;
    margin-bottom: 8px;
    animation: fade-in 0.18s ease;
  }
  li.item.expired { border-color: #3a4a3f; }
  @keyframes fade-in { from { opacity: 0; transform: translateY(-2px); } to { opacity: 1; transform: none; } }

  .item-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .dom { font-size: 13px; font-weight: 600; word-break: break-all; }
  .badge {
    font-size: 10.5px; font-weight: 600; padding: 3px 7px; border-radius: 100px;
    white-space: nowrap; flex: none;
  }
  .badge.locked { background: rgba(91, 140, 255, 0.15); color: var(--accent-2); }
  .badge.unlocked { background: rgba(52, 211, 153, 0.15); color: var(--good); }

  .progress {
    height: 4px; background: var(--panel-2); border-radius: 100px; margin-top: 8px; overflow: hidden;
  }
  .progress .bar {
    height: 100%; border-radius: 100px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width 0.3s ease;
  }

  .item-actions { display: flex; align-items: center; gap: 6px; margin-top: 9px; }
  .item-actions select.dur { flex: 1; padding: 6px 6px; font-size: 11.5px; }
  .btn-action {
    border: none; border-radius: 7px; padding: 6px 10px; font-size: 11.5px; font-weight: 600;
    cursor: pointer; white-space: nowrap; transition: background 0.15s ease;
  }
  li.item.active .btn-action { background: rgba(91, 140, 255, 0.18); color: var(--accent-2); }
  li.item.active .btn-action:hover { background: rgba(91, 140, 255, 0.3); }
  li.item.expired .btn-action { background: rgba(52, 211, 153, 0.18); color: var(--good); }
  li.item.expired .btn-action:hover { background: rgba(52, 211, 153, 0.3); }

  .maxed { font-size: 10.5px; color: var(--muted); flex: 1; }

  .btn-remove {
    border: none; background: transparent; color: var(--bad); cursor: pointer;
    font-size: 11.5px; font-weight: 600; padding: 6px 8px; border-radius: 7px; white-space: nowrap;
    margin-left: auto;
  }
  .btn-remove:hover { background: rgba(255, 122, 122, 0.12); }

  .empty {
    font-size: 12px; color: var(--muted); text-align: center;
    padding: 22px 10px; border: 1px dashed var(--border); border-radius: 12px;
  }

  footer { margin-top: 12px; text-align: center; }
  footer p { font-size: 10px; color: #5b6272; margin: 0; }
</style>
</head>
<body>
  <header>
    <div class="logo">🔒</div>
    <div>
      <h1>Locked Site Blocker</h1>
      <p class="sub">Blocks a site + all subdomains until its timer runs out.</p>
    </div>
  </header>

  <div class="add-card">
    <input id="url" type="text" placeholder="e.g. facebook.com" autofocus>
    <div class="add-row2">
      <select id="addDur"></select>
      <button class="btn-primary" id="addBtn">Block</button>
    </div>
  </div>
  <div id="msg"></div>

  <div class="list-head">
    <h2>Blocked sites</h2>
    <span id="count"></span>
  </div>
  <ul id="list"></ul>

  <footer>
    <p>Extending only ever adds time — never removes it.</p>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
